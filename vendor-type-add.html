{% extends 'base.html' %}
{% load static %}

{% block title %}VMS Panel{% endblock %}

{% block content %}
<main class="content">
    <!-- Breadcrumb -->
    <section class="page-inner d-flex align-items-left align-items-md-center flex-column flex-md-row pt-2 pb-3">
         <div class="page-heading">
             <h1 class="page-title">Add Vendor Type</h1>
             <nav aria-label="breadcrumb">
                 <ol class="breadcrumb">
                     <li class="breadcrumb-item">
                         <a href="{% url 'dashboard' %}">Dashboard</a>
                     </li>
                     <li class="breadcrumb-item">
                        <a href="{% url 'vendor-type' %}">Vendor Types</a>
                    </li>
                     <li class="breadcrumb-item">
                        Add Vendor Type
                     </li>
                 </ol>
             </nav>
         </div>
    </section>

    <section class="mb-4">
        <div class="card">
            <div class="card-body p-4">
                <div class="section-heading">
                    <p>
                       Fields marked with <span class="star-required">*</span> are required.
                    </p>
                </div>
                <form id="AdvancedForm" class="needs-validation">
                    <div class="row g-4">
                        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                            <label for="typeCode" class="form-label">Type Code <span class="star-required">*</span></label>
                            <input type="text" class="form-control" id="typeCode" name="typeCode" placeholder="Enter type code" required>
                        </div>
                        <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                            <label for="typeName" class="form-label">Type Name <span class="star-required">*</span></label>
                            <input type="text" class="form-control" id="typeName" name="typeName" placeholder="Enter type name" required>
                        </div>
                       <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                           <div class="textarea-counter-wrapper">
                               <label for="address" class="form-label">
                                   Description <span class="star-required">*</span>
                               </label>
                               <textarea class="form-control" id="address" maxlength="500" placeholder="Type address here..."></textarea>
                               <div class="form-text text-end">
                                   <span class="textarea-count">0</span>/<span class="textarea-max">500</span>
                               </div>
                           </div>
                       </div>
                       <div class="col-xl-4 col-lg-4 col-md-4 col-sm-6 col-12">
                           <label class="form-label">
                               Status <span class="star-required">*</span>
                           </label><br>
                           <div class="selectgroup selectgroup-primary selectgroup-pills">
                               <label class="selectgroup-item mb-2">
                                 <input type="radio" name="status" value="active" class="selectgroup-input" id="status1" required="" checked>
                                 <span class="selectgroup-button ">Active</span>
                               </label>
                               <label class="selectgroup-item mb-2">
                                 <input type="radio" name="status" value="inactive" class="selectgroup-input" id="status2" required="">
                                 <span class="selectgroup-button">Inactive</span>
                               </label>
                           </div>
                       </div>
                       <div class="d-print-none">
                           <p class="text-center pt-2">
                             <button type="submit" class="btn btn-primary btn-sm">Submit</button>
                             <a href="{% url 'vendor-type' %}"><button type="button" class="btn btn-secondary btn-sm" name="button">Back</button></a>
                           </p>
                       </div>
                    </div>
                </form>
            </div>
        </div>

       </section>
</main>
{% endblock %}
